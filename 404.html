    // --- 5. ИГРОВЫЕ ДЕЙСТВИЯ ---

    function spendHour() {
      if (state.timeLeft <= 0) {
        showModal('Время вышло!', 'Все 6 часов расследования истекли. Перейдите в раздел «Вердикт», чтобы вынести обвинение!');
        return false;
      }
      state.timeLeft = state.timeLeft - 1;
      return true;
    }

    function inspectRoom(roomId) {
      var room = MAP_ROOMS[roomId];
      if (!room) return;
      if (hasFlag(room.inspectFlag)) return;
      if (!spendHour()) return;
      addFlag(room.inspectFlag);
      render();
    }

    function askQuestion(suspectId, qId) {
      var s = SUSPECTS[suspectId];
      if (!s) return;
      var q = null;
      for (var i = 0; i < s.questions.length; i++) {
        if (s.questions[i].id === qId) {
          q = s.questions[i];
          break;
        }
      }
      if (!q) return;
      if (q.reqFlag && !hasFlag(q.reqFlag)) return;

      if (!hasAsked(q.id)) {
        if (q.cost > 0) {
          if (!spendHour()) return;
        }
        state.askedQuestions.push(q.id);
        if (q.unlockFlag) addFlag(q.unlockFlag);
      }

      state.lastAnswer = {
        name: s.name,
        question: q.title,
        answer: q.answer
      };
      render();
    }

    function checkCode(puzzleId) {
      var p = PUZZLES[puzzleId];
      var inputEl = document.getElementById('code-input-' + puzzleId);
      if (!p || !inputEl) return;

      var val = (inputEl.value || '').replace(/^\s+|\s+$/g, '').toUpperCase().replace(/[:\s\-]/g, '');
      if (!val) return;

      if (val === p.answer) {
        addFlag(p.flag);
        state.codeFeedback[puzzleId] = { ok: true, msg: 'Код принят! Секретная улика открыта.' };
      } else {
        state.codeFeedback[puzzleId] = { ok: false, msg: 'Неверный код (' + val + '). Перепроверьте улику!' };
      }
      render();
    }

    function submitVerdict(moral) {
      if (!state.verdictKiller || !state.verdictDiamond) return;
      var hasProof = hasFlag('flag_locker_open') || hasFlag('flag_cctv_open');

      if (!moral && state.verdictKiller === 'alina' && state.verdictDiamond === 'compass' && hasProof && hasFlag('flag_safe_open')) {
        state.verdictStep = 3;
        render();
        return;
      }

      if (state.verdictKiller !== 'alina') {
        state.endingId = 'fail';
      } else if (state.verdictDiamond !== 'compass' || !hasProof) {
        state.endingId = 'partial';
      } else if (moral === 'bribe') {
        state.endingId = 'corrupt';
      } else {
        state.endingId = 'perfect';
      }
      render();
    }

    function resetGame() {
      showModal('Начать расследование заново?', 'Все открытые улики, коды и счётчик времени будут сброшены.', function() {
        state.tab = 'intro';

        state.codeFeedback = {};
        state.verdictKiller = '';
        state.verdictDiamond = '';
        state.verdictStep = 1;
        state.endingId = null;

    }

            '&gt; ТЕРМИНАЛ ОХРАНЫ • КАМЕРА №04 (2-Й ЭТАЖ)<br/>' +
            '&gt; [22:00:00] ПИТАНИЕ: НОРМА<br/>' +
            '&gt; <span style="color:#ff8a80;font-weight:bold;">[22:40:00] ОТКЛЮЧЕНИЕ ПИТАНИЯ (РУБИЛЬНИК)</span><br/>' +
            '&gt; [22:43:00] ЗАПУСК ГЕНЕРАТОРА (+3 МИН)<br/><br/>' +
            'ПОКАЗАНИЯ МАРКА ВОЛКОВА: «Я чётко слышал, как щёлкнул замок кабинета ровно за 5 минут до того, как погас свет.»<br/><br/>' +
            'ВВЕДИТЕ ВРЕМЯ В ФОРМАТЕ ЧЧММ (4 ЦИФРЫ):' +
          '</div>';
      }

      var inputArea = '';
      if (solved) {
        inputArea = '' +
          '<div class="clue-item clue-unlocked" style="margin-top:14px;">' +
            '<div style="font-size:20px;font-weight:bold;margin-bottom:6px;">🔓 ' + cur.secretTitle + '</div>' +
            '<div>' + cur.secretText + '</div>' +
          '</div>';
      } else {
        inputArea = '' +
          '<div style="margin-top:16px;">' +
            '<input id="code-input-' + cur.id + '" class="code-input" type="text" placeholder="' + cur.hint + '" />' +
            '<button class="btn" data-action="check-code" data-puzzle="' + cur.id + '">Проверить код</button>' +
            (fb ? '<div style="margin-top:10px;font-weight:bold;font-family:Arial,sans-serif;color:' + (fb.ok ? '#2e7d32' : '#b71c1c') + ';">' + fb.msg + '</div>' : '') +
          '</div>';
      }

      return '' +
        '<div class="journal-card">' +
          subNav +
          '<h2 class="journal-title">' + cur.title + '</h2>' +
          '<div class="two-col">' +
            '<div class="col-left">' + puzzleVisual + '</div>' +
            '<div class="col-right" style="text-align:center;">' +
              PUZZLE_SVGS[cur.id] +
              '<div style="text-align:left;">' + inputArea + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function renderVerdictTab() {
      if (state.endingId) {
        var end = ENDINGS[state.endingId];
        return '' +
          '<div class="journal-card">' +
            '<div class="stamp-red">Дело закрыто</div>' +
            '<h2 class="journal-title">' + end.title + '</h2>' +
            '<div class="journal-sub">' + end.subtitle + '</div>' +
            '<p class="journal-text">' + end.text + '</p>' +
            '<div class="sticky-note">' +
              '<strong>Итоги партии:</strong> Разгадано кодов: ' + countSolvedPuzzles() + ' из 4 • Осталось часов: ' + state.timeLeft + ' из 6.' +
            '</div>' +
            '<button class="btn" data-action="reset-game">🔄 Начать расследование заново</button>' +
          '</div>';
      }

      if (state.verdictStep === 3) {
        return '' +
          '<div class="journal-card">' +
            '<div class="stamp-red">Шаг 3 из 3 • Моральный выбор</div>' +
            '<h2 class="journal-title">Шёпот Елены Ветровой</h2>' +
            '<p class="journal-text" style="font-style:italic;">' +
              '«Детективы, вы поймали убийцу и нашли настоящий бриллиант! Полиция ещё не знает про мою с Марком страховую аферу. Промолчите о расписке из сейфа — и я переведу вашей команде 500 000 €.»' +
            '</p>' +
            '<button class="btn btn-green btn-block" data-action="submit-moral" data-moral="expose">⚖️ Сдать Елену и Марка полиции</button>' +
            '<button class="btn btn-block" data-action="submit-moral" data-moral="bribe">💰 Взять 500 000 € и скрыть аферу</button>' +
          '</div>';
      }

      var killers = [
        { id: 'elena', label: 'Елена Ветрова' },
        { id: 'mark', label: 'Марк Волков' },
        { id: 'viktor', label: 'Виктор Громов' },
        { id: 'alina', label: 'Алина Смирнова' }
      ];
      var places = [
        { id: 'cellar', label: 'В винном погребе за трубой' },
        { id: 'purse', label: 'В сумочке Елены Ветровой' },
        { id: 'compass', label: 'В латунном компасе Аркадия' },
        { id: 'viktor', label: 'У Виктора Громова' }
      ];

      var kHtml = '';
      for (var i = 0; i < killers.length; i++) {
        var k = killers[i];
        kHtml += '<button class="btn btn-block' + (state.verdictKiller === k.id ? '' : ' btn-dark') + '" data-action="pick-killer" data-val="' + k.id + '">' +
          (state.verdictKiller === k.id ? '● ' : '○ ') + k.label + '</button>';
      }

      var pHtml = '';
      for (var j = 0; j < places.length; j++) {
        var pl = places[j];
        pHtml += '<button class="btn btn-block' + (state.verdictDiamond === pl.id ? '' : ' btn-dark') + '" data-action="pick-diamond" data-val="' + pl.id + '">' +
          (state.verdictDiamond === pl.id ? '● ' : '○ ') + pl.label + '</button>';
      }

      var canGo = state.verdictKiller && state.verdictDiamond;

      return '' +
        '<div class="journal-card">' +
          '<div class="stamp-red">Финальное обвинение</div>' +
          '<h2 class="journal-title">Вынесите вердикт</h2>' +
          '<div class="two-col">' +
            '<div class="col-half-left">' +
              '<h3 style="font-size:20px;margin:0 0 8px 0;">1. Кто убил Аркадия Соколова?</h3>' +
              kHtml +
            '</div>' +
            '<div class="col-half-right">' +
              '<h3 style="font-size:20px;margin:0 0 8px 0;">2. Где настоящий бриллиант «Сердце Севера»?</h3>' +
              pHtml +
            '</div>' +
          '</div>' +
          '<div style="margin-top:16px;">' +
            '<button class="btn btn-block' + (canGo ? ' btn-green' : ' btn-disabled') + '" data-action="submit-verdict">' +
              '⚖️ Огласить финальный вердикт' +
            '</button>' +
          '</div>' +
        '</div>';
    }

    function renderMain() {
      var isPhone = state.mode === 'phone';
      var appEl = document.getElementById('app');
      appEl.className = isPhone ? 'app-wrap phone-wrap' : 'app-wrap';

      if (state.mode === 'landing') {
        appEl.innerHTML = renderLanding();
        return;
      }

      var tabs = [
        { id: 'intro', label: '📖 Дело' },
        { id: 'map', label: '🗺️ Карта' },
        { id: 'suspects', label: '📌 Допросы' },
        { id: 'puzzles', label: '🔑 Коды (' + countSolvedPuzzles() + '/4)' },
        { id: 'verdict', label: '⚖️ Вердикт' }
      ];
      var navHtml = '<div class="nav-bar">';
      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        navHtml += '<button class="nav-btn' + (state.tab === t.id ? ' nav-btn-active' : '') + '" data-action="set-tab" data-tab="' + t.id + '">' + t.label + '</button>';
      }
      navHtml += '</div>';

      var contentHtml = '';
      if (state.tab === 'intro') contentHtml = renderIntroTab();
      else if (state.tab === 'map') contentHtml = renderMapTab();
      else if (state.tab === 'suspects') contentHtml = renderSuspectsTab();
      else if (state.tab === 'puzzles') contentHtml = renderPuzzlesTab();
      else if (state.tab === 'verdict') contentHtml = renderVerdictTab();

      var headerHtml = '' +
        '<div class="top-bar">' +
          '<div class="top-bar-left">' +
            '<div class="brand-sub">ДНЕВНИК №3 • ДЕЛО №404-Б (' + (isPhone ? 'ТЕЛЕФОН' : 'ТВ') + ')</div>' +
            '<div class="brand-title">СЕРДЦЕ СЕВЕРА</div>' +
          '</div>' +
          '<div class="top-bar-right">' +
            '<span class="stat-pill">🔑 Коды: ' + countSolvedPuzzles() + '/4</span>' +
            '<span class="stat-pill' + (state.timeLeft <= 1 ? ' stat-pill-danger' : '') + '">⏱ Часы: ' + state.timeLeft + '/6</span>' +
            '<button class="nav-btn" style="padding:6px 12px;font-size:14px;" data-action="reset-game">🔄</button>' +
          '</div>' +
        '</div>';

      appEl.innerHTML = headerHtml + navHtml + contentHtml;
    }

    function render() {
      renderMain();
    }

    // --- 8. ЕДИНЫЙ ОБРАБОТЧИК КЛИКОВ (ES5) ---

    document.onclick = function(e) {
      e = e || window.event;
      var target = e.target || e.srcElement;
      var el = findActionEl(target);
      if (!el) return;

      var act = el.getAttribute('data-action');
      if (act === 'start-mode') {
        state.mode = el.getAttribute('data-mode');
        state.tab = 'intro';
        render();
      } else if (act === 'set-tab') {
        state.tab = el.getAttribute('data-tab');
        render();
      } else if (act === 'select-room') {
        state.selectedRoom = el.getAttribute('data-room');
        render();
      } else if (act === 'inspect-room') {
        inspectRoom(el.getAttribute('data-room'));
      } else if (act === 'select-suspect') {
        state.selectedSuspect = el.getAttribute('data-suspect');
        render();
      } else if (act === 'ask-q') {
        askQuestion(el.getAttribute('data-suspect'), el.getAttribute('data-q'));
      } else if (act === 'select-puzzle') {
        state.selectedPuzzle = el.getAttribute('data-puzzle');
        render();
      } else if (act === 'check-code') {
        checkCode(el.getAttribute('data-puzzle'));
      } else if (act === 'pick-killer') {
        state.verdictKiller = el.getAttribute('data-val');
        render();
      } else if (act === 'pick-diamond') {
        state.verdictDiamond = el.getAttribute('data-val');
        render();
      } else if (act === 'submit-verdict') {
        submitVerdict(null);
      } else if (act === 'submit-moral') {
        submitVerdict(el.getAttribute('data-moral'));
      } else if (act === 'reset-game') {
        resetGame();
      }
    };

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
